[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrrho"
version = "0.1.0"
description = "Adversarial review of Terraform plans: what the plan really does, and what it newly exposes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Marcos Morris" }]
keywords = [
  "terraform",
  "infrastructure-as-code",
  "security",
  "sarif",
  "devsecops",
  "network-security",
  "code-review",
  "ci",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
pyrrho = "pyrrho.cli:main"

[project.urls]
Homepage = "https://github.com/MarckMorris/pyrrho"
Issues = "https://github.com/MarckMorris/pyrrho/issues"

[tool.setuptools.packages.find]
include = ["pyrrho*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
